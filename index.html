<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>SGE-México: Diseño Eléctrico Residencial - Casa Alacio Pérez (NOM-001-SEDE)</title>
    <meta name="description" content="Gestión reactiva de carga instalada, balanceo de fases y diseño unifilar para Casa Alacio Pérez. Cumplimiento de la norma NOM-001-SEDE y políticas de CFE." />
    
    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:24px;color:#f87171;background:#0f172a;font-family:sans-serif;border:1px solid #ef4444;border-radius:12px;margin:20px auto;max-width:600px;"><h2>Error cargando la aplicación</h2><pre style="white-space:pre-wrap;font-size:12px;color:#cbd5e1;">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre><button onclick="localStorage.clear();location.reload();" style="margin-top:12px;padding:8px 16px;background:#14b8a6;color:#042f2e;font-weight:bold;border:none;border-radius:8px;cursor:pointer;">Restablecer Memoria y Recargar</button></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:24px;color:#f87171;background:#0f172a;font-family:sans-serif;border:1px solid #ef4444;border-radius:12px;margin:20px auto;max-width:600px;"><h2>Error de inicialización asíncrona</h2><pre style="white-space:pre-wrap;font-size:12px;color:#cbd5e1;">' + (e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e.reason)) + '</pre><button onclick="localStorage.clear();location.reload();" style="margin-top:12px;padding:8px 16px;background:#14b8a6;color:#042f2e;font-weight:bold;border:none;border-radius:8px;cursor:pointer;">Restablecer Memoria y Recargar</button></div>';
        }
      });
    </script>
  </head>
  <body class="bg-[#0a0f1d] text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
